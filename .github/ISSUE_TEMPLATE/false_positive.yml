name: False positive / missed secret
description: A rule fires when it shouldn't, or misses something it should catch
labels: [detection]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: LS-GEN-002
  - type: textarea
    id: sample
    attributes:
      label: Sample line
      description: A redacted or made-up line that reproduces it. Never paste a real secret.
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: File path (the type matters for some rules)
      placeholder: .github/workflows/ci.yml
