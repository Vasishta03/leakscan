- id: leakscan
  name: leakscan
  description: Block commits that add secrets (scans staged changes only).
  entry: leakscan scan . --staged --fail-on HIGH --no-progress --brief --no-blame
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit]

- id: leakscan-full
  name: leakscan (full repository)
  description: Scan the whole working tree.
  entry: leakscan scan . --no-progress --brief
  language: python
  pass_filenames: false
  always_run: true
  stages: [manual]
